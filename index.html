<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factory simulation</title>
<style>
body{font:16px system-ui,sans-serif;margin:0;padding:16px;background:#f6f6f4;color:#222}
.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.card{flex:1;min-width:150px}
button,select,input{font:inherit;padding:6px 10px}
.me{border:2px solid #2a6}.big{font-size:1.4em;font-weight:600}.mut{color:#777}
</style></head><body>
<div id="msg" class="card mut"></div>
<div id="app"><div id="kan" class="row"></div><div id="task" class="card"></div><div id="tool" class="card"></div><div id="help"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// 1) PASTE YOUR FIREBASE CONFIG HERE
const CFG={apiKey:"YOUR_KEY",authDomain:"YOUR.firebaseapp.com",databaseURL:"https://YOUR-default-rtdb.europe-west1.firebasedatabase.app",projectId:"YOUR"};
const BAD=CFG.apiKey==='YOUR_KEY'||/YOUR/.test(CFG.databaseURL);
let CONN=null,ERR='';
function banner(){const m=document.getElementById('msg');if(!m)return;
 m.textContent=BAD?'⚠ Firebase config not set in index.html':ERR?'⚠ '+ERR:(CONN?'Connected':'Not connected to database…')+(S.team&&S.team.cond?'':' · team '+T+' not set up: open ?admin=1&team='+T+', press Save, then Start')}
window.onerror=m=>{ERR=m;banner()};
if(!BAD)firebase.initializeApp(CFG);
const db=BAD?null:firebase.database(),TS=BAD?0:firebase.database.ServerValue.TIMESTAMP;
if(db)db.ref('.info/connected').on('value',s=>{CONN=s.val();banner()});
const U=new URLSearchParams(location.search),T=U.get('team')||'T01',R=U.get('role'),PID=U.get('pid')||'';
const RN={M:'Maintenance Technician',Q:'Quality Inspector',P:'Production Planner'};
const N=10,ROUNDS=10,PEN=10000; // errors/round, rounds, wrong-answer penalty (ms)
// 2) PLACEHOLDER CONTENT: replace ACT/CAU (or kb()) with your real error dataset
const ACT=['Reset controller','Replace sensor','Recalibrate axis','Flush coolant line','Tighten fixture','Replace filter','Update PLC firmware','Re-seat connector','Lubricate spindle','Adjust feed rate','Restart conveyor','Replace belt'];
const CAU=['Sensor drift','Worn part','Loose fitting','Contamination','Firmware fault','Overheating','Misalignment','Supply fault','Wear','Parameter error','Jam','Fatigue'];
const num=c=>parseInt(String(c).replace(/\D/g,''))-100;
const mk=(r,k,j)=>'E-'+(100+'MQP'.indexOf(r)*100+k*10+j);
const kb=c=>{const n=num(c);return{cause:CAU[(n*7)%12],act:ACT[(n*5+3)%12],conf:60+(n*13)%40}};
const opts=c=>{const a=(num(c)*5+3)%12;const l=[0,2,5,7,10].map(o=>ACT[(a+o)%12]);l.sort(()=>Math.random()-.5);l.push('Ignore this error');return l};
let S={team:{},idx:0,round:0,ok:0,tot:0,t0:0,rs:0,opts:[],cur:'',lock:false,found:null};
const $=id=>document.getElementById(id);
const log=(type,d)=>db.ref('events/'+T).push(Object.assign({ts:TS,cts:Date.now(),pid:PID,role:R,type,round:S.round},d||{}));

// ---------- participant ----------
function init(){
  banner();if(BAD)return;
  tool();kan();help();task();
  db.ref('teams/'+T).on('value',s=>{
    const v=s.val()||{};S.team=v;
    if(v.started&&v.round&&v.round!==S.round){
      S.round=v.round;S.idx=0;S.ok=0;S.rs=Date.now();
      if(S.round<=ROUNDS){log('round_start');next()}
    }
    maybeAdvance();kan();help();task();tool();banner();
  },e=>{ERR='Database error: '+e.message+' (check Realtime Database rules)';banner()});
}
function next(){
  S.lock=false;
  if(S.idx>=N){S.cur='';log('round_end',{ms:Date.now()-S.rs});return}
  S.cur=mk(R,S.round-1,S.idx);S.opts=opts(S.cur);S.t0=Date.now();
  log('error_shown',{code:S.cur});
}
function submit(){
  const ch=$('sel').value;if(!ch||S.lock)return;
  const ok=ch===ACT[(num(S.cur)*5+3)%12];
  log('answer',{code:S.cur,choice:ch,correct:ok,ms:Date.now()-S.t0});
  S.idx++;if(ok){S.ok++;S.tot++}
  const go=()=>{db.ref(`teams/${T}/prog/${R}`).set({round:S.round,done:S.idx,tot:S.tot});next();task()};
  if(ok)go();else{S.lock=true;task();setTimeout(go,PEN)}
}
function maybeAdvance(){
  const p=S.team.prog||{},r=S.team.round;
  if(!S.team.started||!r||r>ROUNDS)return;
  if(['M','Q','P'].every(k=>p[k]&&p[k].round===r&&p[k].done>=N))
    db.ref(`teams/${T}/round`).transaction(x=>x===r?r+1:x);
}
function look(){
  const q=$('q').value.trim(),n=num(q);
  const own=Math.floor(n/100)==='MQP'.indexOf(R)&&n%10===0&&S.team.bn===R; // bottleneck gap
  const f=n>=0&&n<300&&!own;
  S.found=f?Object.assign({q},kb(q)):{q,none:1};
  log('lookup',{q,found:f});tool();
}
function ask(){if(!S.cur)return;const h=db.ref(`teams/${T}/help`).push({from:R,code:S.cur,round:S.round,status:'open',t:Date.now()});log('help_request',{code:S.cur,hid:h.key})}
function aid(id,c){db.ref(`teams/${T}/help/${id}`).update({status:'active',helper:R,t0:Date.now()});log('help_start',{hid:id,code:c})}
function fin(id,c,t0){db.ref(`teams/${T}/help/${id}`).update({status:'done',t1:Date.now()});log('help_end',{hid:id,code:c,ms:Date.now()-t0})}

let sigT='',sigL='';
function task(){
  const k=[S.team.started,S.round,S.idx,S.lock,S.cur].join();if(k===sigT)return;sigT=k;
  const t=S.team;let h;
  if(!t.started)h='Waiting for the experimenter to start…';
  else if(S.round>ROUNDS)h='<b class="big">Finished.</b> Please wait for instructions.';
  else if(S.idx>=N)h=`Round ${S.round} complete. Waiting for teammates…`;
  else if(S.lock)h='<b>Incorrect.</b> Penalty: please wait 10 seconds…';
  else h=`<div class="mut">Round ${S.round}/${ROUNDS} · error ${S.idx+1}/${N}</div><div class="big">Alarm ${S.cur}</div><p>Select the corrective action:</p><select id="sel"><option value="">—</option>${S.opts.map(o=>`<option>${o}</option>`).join('')}</select> <button onclick="submit()">Submit</button>`;
  $('task').innerHTML=h;
}
function tool(){
  const k=S.team.cond+JSON.stringify(S.found);if(k===sigL||($('q')&&document.activeElement===$('q')))return;sigL=k;
  const ai=S.team.cond==='ai',f=S.found;
  $('tool').innerHTML=`<b>${ai?'AI assistant':'Manual'}</b> <input id="q" placeholder="Error code, e.g. E-105" value="${f?f.q:''}"> <button onclick="look()">Look up</button>`+
  (f?(f.none?'<p>Error not found.</p>':`<p>Root cause: ${f.cause}<br>Recommended action: <b>${f.act}</b>${ai?`<br>Confidence: ${f.conf}%`:''}</p>`):'');
}
function kan(){
  const p=S.team.prog||{};
  $('kan').innerHTML=['M','Q','P'].map(k=>{const x=p[k]||{};return`<div class="card ${k===R?'me':''}"><b>${RN[k]}</b>${k===R?' (you)':''}<br>Round ${S.round||0}: ${x.round===S.round?x.done||0:0}/${N} done<br>Resolved so far: ${x.tot||0}</div>`}).join('');
}
function help(){
  const H=S.team.help||{};let h='<div class="card"><button onclick="ask()">Ask a teammate for help with this error</button>';
  for(const[id,x]of Object.entries(H)){
    if(x.status==='done')continue;
    if(x.from===R)h+=`<p>Your request (${x.code}): ${x.status==='open'?'waiting…':'being helped by '+RN[x.helper]}</p>`;
    else if(x.status==='open')h+=`<p>${RN[x.from]} asks for help with ${x.code} <button onclick="aid('${id}','${x.code}')">I'll help</button></p>`;
    else if(x.helper===R)h+=`<p>Helping ${RN[x.from]} with ${x.code} <button onclick="fin('${id}','${x.code}',${x.t0})">Done helping</button></p>`;
  }
  $('help').innerHTML=h+'</div>';
}

// ---------- admin (?admin=1&team=T01) ----------
function admin(){
  if(BAD){document.body.innerHTML='<p>Firebase config not set in index.html</p>';return}
  document.body.innerHTML=`<h2>Admin · ${T}</h2><div class="card">Condition <select id="c"><option value="ai">Full AI</option><option value="noai">No AI</option></select> Bottleneck role <select id="b"><option>M</option><option>Q</option><option>P</option></select> <button onclick="setup()">Save (resets team)</button> <button onclick="rnd()">Random condition</button></div><div class="card"><button onclick="start()">Start</button> <button onclick="csv()">Download event log (CSV)</button></div><pre id="st"></pre>`;
  db.ref('teams/'+T).on('value',s=>$('st').textContent=JSON.stringify(s.val(),null,1));
}
const setup=()=>db.ref('teams/'+T).set({cond:$('c').value,bn:$('b').value,started:false,round:0,created:TS});
const rnd=()=>{const a=new Uint8Array(1);crypto.getRandomValues(a);$('c').value=a[0]%2?'ai':'noai'};
const start=()=>db.ref('teams/'+T).update({started:true,round:1,t0:TS});
function csv(){
  db.ref('events/'+T).once('value',s=>{
    const rows=Object.values(s.val()||{}).sort((a,b)=>a.ts-b.ts);
    const cols=['ts','cts','pid','role','type','round','code','choice','correct','ms','q','found','hid'];
    const t=[cols.join(',')].concat(rows.map(r=>cols.map(c=>JSON.stringify(r[c]??'')).join(','))).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=T+'.csv';a.click();
  });
}
if(U.has('admin'))admin();
else if(!'MQP'.includes(R||'x'))document.body.innerHTML='<p>Missing or invalid ?role=M|Q|P</p>';
else init();
</script></body></html>
